<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown to 5 pm</title>
<style>
  :root { --bg:#191919; --card:#202020; --text:#e9e9e7; --muted:#9b9a97; --accent:#ff8a3d; --track:#2f2f2f; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --card:#f7f6f3; --text:#37352f; --muted:#787774; --accent:#d9730d; --track:#e9e9e7; }
  }
  html,body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center;
         font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--text); }
  .card { width:min(520px, 94vw); background:var(--card); border-radius:14px; padding:18px 22px 20px; box-sizing:border-box; }
  .label { font-size:13px; color:var(--muted); letter-spacing:.02em; display:flex; justify-content:space-between; }
  .time { font-variant-numeric: tabular-nums; font-size:clamp(36px, 11vw, 56px); font-weight:700; line-height:1.1; margin:6px 0 12px; }
  .time small { font-size:.38em; font-weight:500; color:var(--muted); margin-left:4px; }
  .bar { height:10px; background:var(--track); border-radius:99px; overflow:hidden; }
  .fill { height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .9s linear; }
  .foot { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="label"><span id="title">⏰ Until 5 pm</span><span id="now"></span></div>
    <div class="time" id="time">--:--:--</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="foot"><span>9:00</span><span id="pct"></span><span>17:00</span></div>
  </div>
<script>
  // Optional URL settings: ?end=17:00&start=09:00&tz=Europe/Vilnius
  const q = new URLSearchParams(location.search);
  const TZ = q.get('tz') || 'Europe/Vilnius';
  const toMin = s => { const [h,m] = s.split(':').map(Number); return h*60 + (m||0); };
  const END = toMin(q.get('end') || '17:00'), START = toMin(q.get('start') || '09:00');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  const pad = n => String(n).padStart(2,'0');
  const endLabel = `${END/60|0}:${pad(END%60)}`;
  document.getElementById('title').textContent = `⏰ Until ${END===1020 ? '5 pm' : endLabel}`;
  function tick() {
    const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
    const h = +parts.hour % 24, m = +parts.minute, s = +parts.second;
    const nowSec = h*3600 + m*60 + s, endSec = END*60, startSec = START*60;
    document.getElementById('now').textContent = `now ${pad(h)}:${pad(m)}`;
    let left = endSec - nowSec;
    const timeEl = document.getElementById('time');
    if (left <= 0) {
      timeEl.innerHTML = '🎉 Done for today';
    } else {
      const hh = left/3600|0, mm = (left%3600)/60|0, ss = left%60;
      timeEl.innerHTML = `${pad(hh)}:${pad(mm)}:${pad(ss)}<small>left</small>`;
    }
    const p = Math.min(Math.max((nowSec - startSec) / (endSec - startSec), 0), 1);
    document.getElementById('fill').style.width = (p*100).toFixed(1) + '%';
    document.getElementById('pct').textContent = Math.round(p*100) + '% of the day';
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
